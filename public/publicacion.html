
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLECTIVO CHACAL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">

    <style>
        .footer-chacal-link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: auto;
            height: 80px;
            text-decoration: none;
        }

        .footer-chacal {
            display: block;
            width: auto;
            height: 80px;
            object-fit: contain;
        }

        .footer-chacal-hover {
            display: none;
        }

        .footer-chacal-link:hover .footer-chacal-normal,
        .footer-chacal-link.tocado .footer-chacal-normal {
            display: none;
        }

        .footer-chacal-link:hover .footer-chacal-hover,
        .footer-chacal-link.tocado .footer-chacal-hover {
            display: block;
        }

        .galeria-movil-track,
        .galeria-contador {
            display: none;
        }

        @media (max-width: 700px) {
            .footer-chacal-link,
            .footer-chacal {
                height: 70px;
            }

            .galeria-imagen {
                position: relative;
                overflow: hidden;
            }

            .galeria-imagen > img {
                display: none !important;
            }

            .galeria-movil-track {
                position: absolute;
                inset: 0;
                display: block;
                width: 100%;
                height: 100%;
                overflow: hidden;
                touch-action: pan-y;
                user-select: none;
                -webkit-user-select: none;
            }

            .galeria-movil-cinta {
                display: flex;
                width: 300%;
                height: 100%;
                transform: translate3d(-33.333333%, 0, 0);
                transition: transform 260ms ease;
                will-change: transform;
            }

            .galeria-movil-panel {
                flex: 0 0 33.333333%;
                width: 33.333333%;
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
            }

            .galeria-movil-panel img {
                display: block;
                width: auto;
                height: auto;
                max-width: 90%;
                max-height: 90%;
                object-fit: contain;
                pointer-events: none;
                -webkit-user-drag: none;
            }

            .galeria-flecha {
                display: none !important;
            }

            .galeria-contador {
                display: block;
                width: 100%;
                box-sizing: border-box;
                text-align: center;
                margin: 10px 0 0;
                font-size: 12px;
                line-height: 1.4;
                letter-spacing: 0.08em;
                font-variant-numeric: tabular-nums;
            }
        }
    </style>
</head>

<body>

            <span></span><span></span><span></span>
        </button>

        <a href="index.html" class="site-title">COLECTIVO CHACAL</a>

        <nav class="site-nav">
            <div class="nav-publicaciones">
                <button type="button" class="nav-dropdown-button" id="publicaciones-button"
                    aria-expanded="false" aria-controls="publicaciones-menu">
                    PUBLICACIONES

                <div class="nav-dropdown" id="publicaciones-menu">
                    <a href="index.html?categoria=TODO">TODO</a>
                    <a href="index.html?categoria=FANZINES">FANZINES</a>

                    <a href="index.html?categoria=LIBROS">LIBROS</a>
                    <a href="index.html?categoria=FOTOGRAFÍA">FOTOGRAFÍA</a>

        <a href="https://www.instagram.com/colectivochacal"

                <div class="mobile-categorias" id="mobile-categorias">

                    <a href="index.html?categoria=FANZINES">FANZINES</a>
                    <a href="index.html?categoria=REVISTAS">REVISTAS</a>
                    <a href="index.html?categoria=LIBROS">LIBROS</a>
                    <a href="index.html?categoria=FOTOGRAFÍA">FOTOGRAFÍA</a>

    <main class="producto-detalle">
        <section class="producto-galeria">

            <img src="images/chacalparaweb.webp"
                class="footer-chacal footer-chacal-normal" alt="COLECTIVO CHACAL">
            <img src="images/chacalparaweb2.webp"

    <script>
        const publicacionesButton = document.getElementById("publicaciones-button");
        const publicacionesMenu = document.getElementById("publicaciones-menu");
        const mobileMenuButton = document.getElementById("mobile-menu-button");
        const mobileMenu = document.getElementById("mobile-menu");
        const mobilePublicacionesButton = document.getElementById("mobile-publicaciones-button");
        const mobileCategorias = document.getElementById("mobile-categorias");
        const footerChacal = document.querySelector(".footer-chacal-link");

        if (footerChacal) {
            ["pointerdown", "pointerup", "pointercancel", "pointerleave"].forEach(tipo => {
                footerChacal.addEventListener(tipo, () => {
                    footerChacal.classList.toggle("tocado", tipo === "pointerdown");
                });
            });
        }

        publicacionesButton.addEventListener("click", function () {
            const abierto = publicacionesButton.getAttribute("aria-expanded") === "true";
            publicacionesButton.setAttribute("aria-expanded", String(!abierto));
            publicacionesMenu.classList.toggle("abierto", !abierto);
        });

        mobileMenuButton.addEventListener("click", function () {
            const abierto = mobileMenuButton.getAttribute("aria-expanded") === "true";
            mobileMenuButton.setAttribute("aria-expanded", String(!abierto));
            mobileMenu.setAttribute("aria-hidden", String(abierto));
            mobileMenu.classList.toggle("abierto", !abierto);
        });

        mobilePublicacionesButton.addEventListener("click", function () {
            const abierto = mobilePublicacionesButton.getAttribute("aria-expanded") === "true";
            mobilePublicacionesButton.setAttribute("aria-expanded", String(!abierto));
            mobileCategorias.classList.toggle("abierto", !abierto);
        });

        function cerrarMenuMovil() {
            mobileMenuButton.setAttribute("aria-expanded", "false");
            mobileMenu.setAttribute("aria-hidden", "true");
            mobileMenu.classList.remove("abierto");
            mobilePublicacionesButton.setAttribute("aria-expanded", "false");
            mobileCategorias.classList.remove("abierto");
        }

        document.addEventListener("click", function (evento) {
            if (!evento.target.closest(".nav-publicaciones")) {
                publicacionesButton.setAttribute("aria-expanded", "false");
                publicacionesMenu.classList.remove("abierto");
            }

            if (!evento.target.closest(".site-header")) {
                cerrarMenuMovil();
            }
        });

        mobileMenu.querySelectorAll("a").forEach(enlace => {
            enlace.addEventListener("click", cerrarMenuMovil);
        });

        function escaparHtml(texto) {
            return String(texto)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function procesarInline(texto) {
            let contenido = escaparHtml(texto);

            contenido = contenido.replace(
                /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
                '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
            );

            contenido = contenido.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
            contenido = contenido.replace(/\*(.+?)\*/g, "<em>$1</em>");

            return contenido;
        }

        function convertirMarkdown(markdown) {
            if (!markdown) return "";

            const texto = markdown.replace(/\r\n/g, "\n").replace(/\r/g, "\n").trim();
            if (!texto) return "";

            const partes = texto.split(/(\n+)/);
            let html = "";
            let enLista = false;

            function cerrarLista() {
                if (enLista) {
                    html += "</ul>";
                    enLista = false;
                }
            }

            for (const parte of partes) {
                if (/^\n+$/.test(parte)) {
                    cerrarLista();
                    html += "<br>".repeat(Math.max(1, Math.ceil(parte.length / 2)));
                    continue;
                }

                if (!parte) continue;

                const lineas = parte.split("\n");

                for (let i = 0; i < lineas.length; i++) {
                    const linea = lineas[i];
                    if (!linea) continue;

                    const elementoLista = linea.match(/^- (.+)$/);

                    if (elementoLista) {
                        if (!enLista) {
                            html += "<ul>";
                            enLista = true;
                        }

                        html += "<li>" + procesarInline(elementoLista[1]) + "</li>";
                        continue;
                    }

                    cerrarLista();

                    const encabezado = linea.match(/^(#{1,3}) (.+)$/);

                    if (encabezado) {
                        const nivel = encabezado[1].length;
                        const etiqueta = nivel === 1 ? "h2" : nivel === 2 ? "h3" : "h4";
                        html += "<" + etiqueta + ">" +
                            procesarInline(encabezado[2]) +
                            "</" + etiqueta + ">";
                        continue;
                    }

                    html += procesarInline(linea);
                    if (i < lineas.length - 1) html += "<br>";
                }
            }

            cerrarLista();
            return html;
        }

        function obtenerUrlFotoOptimizada(ruta) {
            try {
                const url = new URL(ruta, window.location.href);

                if (
                    url.origin !== window.location.origin ||
                    !url.pathname.startsWith("/uploads/")
                ) {
                    return ruta;
                }

                const ancho = window.innerWidth <= 700 ? 600 : 1400;
                url.pathname = url.pathname.replace(/^\/uploads\//, "/fotos/");
                url.searchParams.set("w", ancho);

                return url.pathname + url.search + url.hash;
            } catch (error) {
                return ruta;
            }
        }

        async function cargarPublicacion() {
            const parametros = new URLSearchParams(window.location.search);

            const equivalenciasIdsAntiguos = {
                "0": "ben-yart-agc",
                "1": "dikaia",
                "2": "vishovgrad",
                "3": "chacalitos",
                "4": "xulanga-n4",
                "5": "xulanga-n3",
                "6": "xulanga-n2",
                "7": "xulanga-n1",
                "8": "avisos-cierre-lineas-ferreas",
                "9": "chuchulata-petar-dachev"
            };

            const slug = parametros.get("slug");
            const idAntiguo = parametros.get("id");
            const slugFinal = slug !== null ? slug : equivalenciasIdsAntiguos[idAntiguo];

            if (!slugFinal) {
                mostrarError();
                return;
            }

            try {
                const respuesta = await fetch("catalogo.json");
                if (!respuesta.ok) throw new Error("No se pudo cargar catalogo.json");

                const datos = await respuesta.json();

                if (!datos || !Array.isArray(datos.publicaciones)) {
                    throw new Error("El formato de catalogo.json no es válido");
                }

                const publicacion = datos.publicaciones.find(item => item.slug === slugFinal);

                if (!publicacion) {
                    mostrarError();
                    return;
                }

                document.title = publicacion.title + " — COLECTIVO CHACAL";
                document.getElementById("titulo").textContent = publicacion.title || "";
                document.getElementById("precio").textContent = publicacion.price || "";
                document.getElementById("descripcion").innerHTML =
                    convertirMarkdown(publicacion.description || "");

                const galeria = document.getElementById("galeria");
                const contador = document.getElementById("galeria-contador");
                const placeholder = galeria.querySelector(".galeria-placeholder");
                const imagenes = Array.isArray(publicacion.images) ? publicacion.images : [];

                let imagenActual = 0;

                if (imagenes.length === 0) {
                    if (placeholder) placeholder.textContent = "SIN IMÁGENES";
                    contador.style.display = "none";
                    return;
                }

                const imagen = document.createElement("img");
                imagen.alt = publicacion.title || "";
                imagen.decoding = "async";
                imagen.style.display = "block";
                imagen.style.width = "auto";
                imagen.style.height = "auto";
                imagen.style.maxWidth = "100%";
                imagen.style.maxHeight = "100%";
                imagen.style.objectFit = "contain";

                if (placeholder) placeholder.remove();

                galeria.insertBefore(
                    imagen,
                    galeria.querySelector(".galeria-flecha-izquierda")
                );

                const flechaIzquierda = galeria.querySelector(".galeria-flecha-izquierda");
                const flechaDerecha = galeria.querySelector(".galeria-flecha-derecha");

                let trackMovil = null;
                let cintaMovil = null;
                let panelesMovil = [];
                let arrastreActivo = false;
                let inicioX = 0;
                let desplazamientoX = 0;
                let anchoGaleria = 0;
                let punteroActivo = null;
                let movimientoAnimacion = false;
                let direccionMovimiento = 0;

                function esMovil() {
                    return window.innerWidth <= 700;
                }

                function obtenerIndice(indice) {
                    return (indice + imagenes.length) % imagenes.length;
                }

                function actualizarContador() {
                    if (!esMovil() || imagenes.length <= 1) {
                        contador.style.display = "none";
                        return;
                    }

                    contador.style.display = "block";
                    contador.textContent = (imagenActual + 1) + " / " + imagenes.length;
                }

                function actualizarFuentesPanelesMovil() {
                    if (!panelesMovil.length) return;

                    panelesMovil.forEach((panel, posicion) => {
                        const foto = panel.querySelector("img");
                        const indice = obtenerIndice(imagenActual + posicion - 1);
                        const rutaOriginal = imagenes[indice];
                        const rutaOptimizada = obtenerUrlFotoOptimizada(rutaOriginal);

                        // No volver a asignar la misma URL: evita recargas innecesarias.
                        if (foto.dataset.ruta !== rutaOptimizada) {
                            foto.dataset.ruta = rutaOptimizada;
                            foto.src = rutaOptimizada;
                        }
                    });
                }

                function crearPanelMovil() {
                    const panel = document.createElement("div");
                    panel.className = "galeria-movil-panel";

                    const foto = document.createElement("img");
                    foto.alt = publicacion.title || "";
                    foto.draggable = false;
                    foto.decoding = "async";

                    panel.appendChild(foto);
                    return panel;
                }

                function colocarCintaEnCentro() {
                    cintaMovil.style.transition = "none";
                    cintaMovil.style.transform =
                        "translate3d(-" + galeria.clientWidth + "px, 0, 0)";

                    // Aplicar el reinicio de posición sin animación.
                    void cintaMovil.offsetWidth;

                    cintaMovil.style.transition = "transform 260ms ease";
                }

                function prepararCarruselMovil() {
                    if (trackMovil) return;

                    trackMovil = document.createElement("div");
                    trackMovil.className = "galeria-movil-track";

                    cintaMovil = document.createElement("div");
                    cintaMovil.className = "galeria-movil-cinta";

                    // Los tres paneles se crean una sola vez.
                    for (let i = 0; i < 3; i++) {
                        const panel = crearPanelMovil();
                        panelesMovil.push(panel);
                        cintaMovil.appendChild(panel);
                    }

                    trackMovil.appendChild(cintaMovil);
                    galeria.appendChild(trackMovil);

                    trackMovil.addEventListener("pointerdown", iniciarArrastre);
                    trackMovil.addEventListener("pointermove", moverArrastre);
                    trackMovil.addEventListener("pointerup", finalizarArrastre);
                    trackMovil.addEventListener("pointercancel", cancelarArrastre);
                    cintaMovil.addEventListener("transitionend", finalizarTransicion);

                    actualizarFuentesPanelesMovil();
                    colocarCintaEnCentro();
                }

                function iniciarArrastre(evento) {
                    if (
                        !esMovil() ||
                        imagenes.length <= 1 ||
                        movimientoAnimacion ||
                        evento.pointerType === "mouse"
                    ) {
                        return;
                    }

                    arrastreActivo = true;
                    punteroActivo = evento.pointerId;
                    inicioX = evento.clientX;
                    desplazamientoX = 0;
                    anchoGaleria = galeria.clientWidth;

                    cintaMovil.style.transition = "none";

                    if (trackMovil.setPointerCapture) {
                        try {
                            trackMovil.setPointerCapture(evento.pointerId);
                        } catch (error) {
                            // El navegador puede haber liberado el puntero.
                        }
                    }
                }

                function moverArrastre(evento) {
                    if (!arrastreActivo || evento.pointerId !== punteroActivo) return;

                    desplazamientoX = evento.clientX - inicioX;

                    cintaMovil.style.transform =
                        "translate3d(" +
                        (-anchoGaleria + desplazamientoX) +
                        "px, 0, 0)";
                }

                function finalizarArrastre(evento) {
                    if (!arrastreActivo || evento.pointerId !== punteroActivo) return;

                    arrastreActivo = false;
                    punteroActivo = null;

                    const umbral = Math.min(70, anchoGaleria * 0.18);

                    if (desplazamientoX < -umbral) {
                        imagenActual = obtenerIndice(imagenActual + 1);
                        direccionMovimiento = 1;
                        movimientoAnimacion = true;

                        cintaMovil.style.transition = "transform 260ms ease";
                        cintaMovil.style.transform =
                            "translate3d(" + (-anchoGaleria * 2) + "px, 0, 0)";
                    } else if (desplazamientoX > umbral) {
                        imagenActual = obtenerIndice(imagenActual - 1);
                        direccionMovimiento = -1;
                        movimientoAnimacion = true;

                        cintaMovil.style.transition = "transform 260ms ease";
                        cintaMovil.style.transform = "translate3d(0, 0, 0)";
                    } else {
                        cintaMovil.style.transition = "transform 260ms ease";
                        cintaMovil.style.transform =
                            "translate3d(-" + anchoGaleria + "px, 0, 0)";
                    }

                    desplazamientoX = 0;
                }

                function cancelarArrastre(evento) {
                    if (!arrastreActivo || evento.pointerId !== punteroActivo) return;

                    arrastreActivo = false;
                    punteroActivo = null;
                    desplazamientoX = 0;

                    cintaMovil.style.transition = "transform 260ms ease";
                    cintaMovil.style.transform =
                        "translate3d(-" + galeria.clientWidth + "px, 0, 0)";
                }

                function finalizarTransicion(evento) {
                    if (
                        evento.target !== cintaMovil ||
                        evento.propertyName !== "transform" ||
                        !movimientoAnimacion
                    ) {
                        return;
                    }

                    movimientoAnimacion = false;

                    // Reutilizar los paneles: no borrar ni recrear las imágenes.
                    if (direccionMovimiento === 1) {
                        const primero = panelesMovil.shift();
                        panelesMovil.push(primero);
                        cintaMovil.appendChild(primero);
                    } else if (direccionMovimiento === -1) {
                        const ultimo = panelesMovil.pop();
                        panelesMovil.unshift(ultimo);
                        cintaMovil.insertBefore(ultimo, cintaMovil.firstElementChild);
                    }

                    direccionMovimiento = 0;

                    colocarCintaEnCentro();
                    actualizarFuentesPanelesMovil();
                    actualizarContador();
                }

                function ajustarImagenMovil() {
                    // El carrusel móvil usa sus propias imágenes.
                    // No cambiar dimensiones al terminar de cargar una imagen.
                }

                function ajustarGaleria() {
                    if (esMovil()) {
                        ajustarImagenMovil();

                        if (trackMovil && !arrastreActivo && !movimientoAnimacion) {
                            colocarCintaEnCentro();
                            actualizarFuentesPanelesMovil();
                        }

                        actualizarContador();
                        return;
                    }

                    const altoDisponible = Math.max(240, window.innerHeight - 180);
                    galeria.style.width = "100%";
                    galeria.style.height = altoDisponible + "px";
                    contador.style.display = "none";
                }

                function mostrarImagen() {
                    const ruta = obtenerUrlFotoOptimizada(imagenes[imagenActual]);

                    // Evitar recargar la imagen si ya se está mostrando esa URL.
                    if (imagen.dataset.ruta !== ruta) {
                        imagen.dataset.ruta = ruta;
                        imagen.onload = ajustarGaleria;
                        imagen.src = ruta;
                    } else if (imagen.complete) {
                        ajustarGaleria();
                    }

                    actualizarContador();

                    if (esMovil()) {
                        prepararCarruselMovil();
                        actualizarFuentesPanelesMovil();
                    }
                }

                window.addEventListener("resize", ajustarGaleria);

                flechaIzquierda.addEventListener("click", function () {
                    imagenActual = obtenerIndice(imagenActual - 1);
                    mostrarImagen();
                });

                flechaDerecha.addEventListener("click", function () {
                    imagenActual = obtenerIndice(imagenActual + 1);
                    mostrarImagen();
                });

                if (imagenes.length === 1) {
                    flechaIzquierda.style.display = "none";
                    flechaDerecha.style.display = "none";
                    contador.style.display = "none";
                }

                mostrarImagen();
                ajustarGaleria();

            } catch (error) {
                console.error(error);
                mostrarError();
            }
        }

        function mostrarError() {
            document.getElementById("titulo").textContent = "PUBLICACIÓN NO ENCONTRADA";
            document.getElementById("precio").textContent = "";
            document.getElementById("descripcion").textContent = "";

            const contador = document.getElementById("galeria-contador");
            if (contador) contador.style.display = "none";
        }

        cargarPublicacion();
    </script>
</body>
