                    aria-expanded="false"

                    PUBLICACIONES

                <div

                    <a href="index.html?categoria=TODO">TODO</a>
                    <a href="index.html?categoria=FANZINES">FANZINES</a>
                    <a href="index.html?categoria=REVISTAS">REVISTAS</a>
                    <a href="index.html?categoria=LIBROS">LIBROS</a>
                    <a href="index.html?categoria=MÁS">MÁS</a>

            <a href="pedidos.html">PEDIDOS</a>

    <main class="producto-detalle">

        <section class="producto-galeria">

            <div class="galeria-imagen" id="galeria">

                <div class="galeria-placeholder">
                    CARGANDO...
                </div>

                <button
                    type="button"
                    class="galeria-flecha galeria-flecha-izquierda"
                    aria-label="Imagen anterior"

                    ←

                <button
                    type="button"
                    class="galeria-flecha galeria-flecha-derecha"
                    aria-label="Imagen siguiente"
                >
                    →
                </button>

            </div>

        </section>


        <section class="producto-info">

            <h1 id="titulo">CARGANDO...</h1>

            <p
                class="producto-precio"
                id="precio"
            ></p>

            <div
                class="producto-descripcion"
                id="descripcion"
            ></div>

    </main>


    <script>

        const publicacionesButton =
            document.getElementById("publicaciones-button");

        const publicacionesMenu =
            document.getElementById("publicaciones-menu");

        const mobileMenuButton =
            document.getElementById("mobile-menu-button");

        const mobileMenu =
            document.getElementById("mobile-menu");

        const mobilePublicacionesButton =
            document.getElementById("mobile-publicaciones-button");

        const mobileCategorias =
            document.getElementById("mobile-categorias");


        publicacionesButton.addEventListener(
            "click",
            function () {

                const abierto =
                    publicacionesButton.getAttribute(
                        "aria-expanded"
                    ) === "true";

                publicacionesButton.setAttribute(
                    "aria-expanded",
                    String(!abierto)
                );

                publicacionesMenu.classList.toggle(
                    "abierto",
                    !abierto
                );
            }
        );


        mobileMenuButton.addEventListener(
            "click",
            function () {

                const abierto =
                    mobileMenuButton.getAttribute(
                        "aria-expanded"
                    ) === "true";

                mobileMenuButton.setAttribute(
                    "aria-expanded",
                    String(!abierto)
                );

                mobileMenu.setAttribute(
                    "aria-hidden",
                    String(abierto)
                );

                mobileMenu.classList.toggle(
                    "abierto",
                    !abierto
                );
            }
        );


        mobilePublicacionesButton.addEventListener(
            "click",
            function () {

                const abierto =
                    mobilePublicacionesButton.getAttribute(
                        "aria-expanded"
                    ) === "true";

                mobilePublicacionesButton.setAttribute(
                    "aria-expanded",
                    String(!abierto)
                );

                mobileCategorias.classList.toggle(
                    "abierto",
                    !abierto
                );
            }
        );


        function cerrarMenuMovil() {

            mobileMenuButton.setAttribute(
                "aria-expanded",
                "false"
            );

            mobileMenu.setAttribute(
                "aria-hidden",
                "true"
            );

            mobileMenu.classList.remove(
                "abierto"
            );

            mobilePublicacionesButton.setAttribute(
                "aria-expanded",
                "false"
            );

            mobileCategorias.classList.remove(
                "abierto"
            );
        }


        document.addEventListener(
            "click",
            function (evento) {

                if (
                    !evento.target.closest(".nav-publicaciones")
                ) {

                    publicacionesButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    publicacionesMenu.classList.remove(
                        "abierto"
                    );
                }


                if (
                    !evento.target.closest(".site-header")
                ) {
                    cerrarMenuMovil();
                }
            }
        );


        mobileMenu
            .querySelectorAll("a")
            .forEach(
                function (enlace) {

                    enlace.addEventListener(
                        "click",
                        cerrarMenuMovil
                    );
                }
            );


        function escaparHtml(texto) {

            return texto
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }


        function procesarInline(texto) {

            let contenido =
                escaparHtml(texto);


            contenido =
                contenido.replace(
                    /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,
                    '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>'
                );


            contenido =
                contenido.replace(
                    /\*\*(.+?)\*\*/g,
                    "<strong>$1</strong>"
                );


            contenido =
                contenido.replace(
                    /\*(.+?)\*/g,
                    "<em>$1</em>"
                );


            return contenido;
        }


        function convertirMarkdown(markdown) {

            if (!markdown) {
                return "";
            }


            const texto =
                markdown
                    .replace(/\r\n/g, "\n")
                    .replace(/\r/g, "\n")
                    .trim();


            if (!texto) {
                return "";
            }


            /*
             * IMPORTANTE:
             *
             * Decap convierte:
             *
             * 1 Enter  → \n\n
             * 2 Enters → \n\n\n\n
             *
             * Por eso trabajamos con pares de saltos
             * de línea, no con cada \n individual.
             */


            const bloques =
                texto.split("\n\n");


            let html = "";


            for (
                let indice = 0;
                indice < bloques.length;
                indice++
            ) {

                const bloque =
                    bloques[indice];


                /*
                 * Un bloque vacío significa que había
                 * una separación adicional:
                 *
                 * A\n\n\n\nB
                 *
                 * → ["A", "", "B"]
                 *
                 * Ese bloque vacío se convierte en
                 * una línea visual adicional.
                 */

                if (bloque === "") {

                    html += "<br>";

                    continue;
                }


                const lineas =
                    bloque.split("\n");


                let enLista = false;


                function cerrarLista() {

                    if (enLista) {
                        html += "</ul>";
                        enLista = false;
                    }
                }


                for (
                    let lineaIndice = 0;
                    lineaIndice < lineas.length;
                    lineaIndice++
                ) {

                    const linea =
                        lineas[lineaIndice];


                    if (
                        linea.match(
                            /^- (.+)$/
                        )
                    ) {

                        if (!enLista) {

                            html += "<ul>";

                            enLista = true;
                        }


                        html +=
                            "<li>" +
                            procesarInline(
                                linea.replace(
                                    /^- (.+)$/,
                                    "$1"
                                )
                            ) +
                            "</li>";


                        continue;
                    }


                    cerrarLista();


                    if (
                        linea.match(
                            /^### (.+)$/
                        )
                    ) {

                        html +=
                            "<h4>" +
                            procesarInline(
                                linea.replace(
                                    /^### (.+)$/,
                                    "$1"
                                )
                            ) +
                            "</h4>";

                        continue;
                    }


                    if (
                        linea.match(
                            /^## (.+)$/
                        )
                    ) {

                        html +=
                            "<h3>" +
                            procesarInline(
                                linea.replace(
                                    /^## (.+)$/,
                                    "$1"
                                )
                            ) +
                            "</h3>";

                        continue;
                    }


                    if (
                        linea.match(
                            /^# (.+)$/
                        )
                    ) {

                        html +=
                            "<h2>" +
                            procesarInline(
                                linea.replace(
                                    /^# (.+)$/,
                                    "$1"
                                )
                            ) +
                            "</h2>";

                        continue;
                    }


                    html +=
                        procesarInline(linea);


                    if (
                        lineaIndice <
                        lineas.length - 1
                    ) {

                        html += "<br>";
                    }
                }


                cerrarLista();


                /*
                 * Cada \n\n normal de Decap
                 * representa un único salto visual.
                 *
                 * Si el siguiente bloque está vacío,
                 * ya hemos añadido el <br> correspondiente
                 * en la siguiente iteración.
                 */

                if (
                    indice <
                    bloques.length - 1 &&
                    bloques[indice + 1] !== ""
                ) {

                    html += "<br>";
                }
            }


            return html;
        }


        async function cargarPublicacion() {

            const parametros =
                new URLSearchParams(
                    window.location.search
                );


            const id =
                parametros.get("id");


            if (!id) {

                mostrarError();

                return;
            }


            try {

                const respuesta =
                    await fetch("catalogo.json");


                if (!respuesta.ok) {

                    throw new Error(
                        "No se pudo cargar catalogo.json"
                    );
                }


                const datos =
                    await respuesta.json();


                if (
                    !datos ||
                    !Array.isArray(
                        datos.publicaciones
                    )
                ) {

                    throw new Error(
                        "El formato de catalogo.json no es válido"
                    );
                }


                const indice =
                    parseInt(id, 10);


                if (
                    Number.isNaN(indice) ||
                    indice < 0 ||
                    indice >=
                    datos.publicaciones.length
                ) {

                    mostrarError();

                    return;
                }


                const publicacion =
                    datos.publicaciones[indice];


                document.title =
                    publicacion.title +
                    " — COLECTIVO CHACAL";


                document.getElementById(
                    "titulo"
                ).textContent =
                    publicacion.title || "";


                document.getElementById(
                    "precio"
                ).textContent =
                    publicacion.price || "";


                document.getElementById(
                    "descripcion"
                ).innerHTML =
                    convertirMarkdown(
                        publicacion.description || ""
                    );


                const galeria =
                    document.getElementById(
                        "galeria"
                    );


                const placeholder =
                    galeria.querySelector(
                        ".galeria-placeholder"
                    );


                const imagenes =
                    Array.isArray(
                        publicacion.images
                    )
                        ? publicacion.images
                        : [];


                let imagenActual = 0;


                if (imagenes.length === 0) {

                    if (placeholder) {

                        placeholder.textContent =
                            "SIN IMÁGENES";
                    }

                    return;
                }


                const imagen =
                    document.createElement(
                        "img"
                    );


                imagen.alt =
                    publicacion.title || "";


                imagen.style.display =
                    "block";

                imagen.style.width =
                    "auto";

                imagen.style.height =
                    "auto";

                imagen.style.maxWidth =
                    "100%";

                imagen.style.maxHeight =
                    "calc(100vh - 180px)";

                imagen.style.objectFit =
                    "contain";


                if (placeholder) {
                    placeholder.remove();
                }


                galeria.insertBefore(
                    imagen,
                    galeria.querySelector(
                        ".galeria-flecha-izquierda"
                    )
                );


                const flechaIzquierda =
                    galeria.querySelector(
                        ".galeria-flecha-izquierda"
                    );


                const flechaDerecha =
                    galeria.querySelector(
                        ".galeria-flecha-derecha"
                    );


                function ajustarGaleria() {

                    if (
                        !imagen.naturalWidth ||
                        !imagen.naturalHeight
                    ) {
                        return;
                    }


                    const anchoDisponible =
                        galeria.parentElement.clientWidth;


                    const altoDisponible =
                        Math.max(
                            240,
                            window.innerHeight - 180
                        );


                    const proporcion =
                        imagen.naturalWidth /
                        imagen.naturalHeight;


                    let ancho =
                        anchoDisponible;


                    let alto =
                        ancho / proporcion;


                    if (
                        alto >
                        altoDisponible
                    ) {

                        alto =
                            altoDisponible;

                        ancho =
                            alto * proporcion;
                    }


                    galeria.style.width =
                        ancho + "px";


                    galeria.style.height =
                        alto + "px";


                    galeria.style.aspectRatio =
                        imagen.naturalWidth +
                        " / " +
                        imagen.naturalHeight;


                    galeria.style.display =
                        "flex";


                    galeria.style.alignItems =
                        "center";


                    galeria.style.justifyContent =
                        "center";
                }


                function mostrarImagen() {

                    imagen.onload =
                        ajustarGaleria;


                    imagen.src =
                        imagenes[imagenActual];


                    if (imagen.complete) {

                        ajustarGaleria();
                    }
                }


                window.addEventListener(
                    "resize",
                    ajustarGaleria
                );


                flechaIzquierda.addEventListener(
                    "click",
                    function () {

                        imagenActual--;


                        if (
                            imagenActual < 0
                        ) {

                            imagenActual =
                                imagenes.length - 1;
                        }


                        mostrarImagen();
                    }
                );


                flechaDerecha.addEventListener(
                    "click",
                    function () {

                        imagenActual++;


                        if (
                            imagenActual >=
                            imagenes.length
                        ) {

                            imagenActual = 0;
                        }


                        mostrarImagen();
                    }
                );


                if (imagenes.length === 1) {

                    flechaIzquierda.style.display =
                        "none";

                    flechaDerecha.style.display =
                        "none";
                }


                mostrarImagen();

            } catch (error) {

                console.error(error);

                mostrarError();
            }
        }


        function mostrarError() {

            document.getElementById(
                "titulo"
            ).textContent =
                "PUBLICACIÓN NO ENCONTRADA";


            document.getElementById(
                "precio"
            ).textContent =
                "";


            document.getElementById(
                "descripcion"
            ).textContent =
                "";
        }


        cargarPublicacion();

    </script>
