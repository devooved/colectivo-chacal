<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COLECTIVO CHACAL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">

        <a href="index.html" class="site-title">
            COLECTIVO CHACAL
        </a>

        <nav class="site-nav">
            <a href="index.html">PUBLICACIONES</a>
            <a href="about.html">ABOUT</a>
        </nav>

    </header>


    <main class="publicaciones">

        <section class="grid" id="catalogo">

            <!-- Las publicaciones se cargarán desde catalogo.json -->

        </section>

    </main>


    <script>

        async function cargarCatalogo() {

            const catalogo =
                document.getElementById("catalogo");

            try {

                const respuesta =
                    await fetch("catalogo.json");


                if (!respuesta.ok) {
                    throw new Error(
                        "No se pudo cargar catalogo.json"
                    );
                }


                const datos =
                    await respuesta.json();


                if (
                    !datos ||
                    !Array.isArray(datos.publicaciones)
                ) {
                    throw new Error(
                        "El formato de catalogo.json no es válido"
                    );
                }


                datos.publicaciones.forEach(
                    function (publicacion, indice) {

                        const numero =
                            String(indice + 1)
                                .padStart(2, "0");


                        const producto =
                            document.createElement("article");

                        producto.className =
                            "producto";


                        const enlace =
                            document.createElement("a");

                        /*
                         * Todas las publicaciones utilizan
                         * la misma plantilla dinámica.
                         */

                        enlace.href =
                            "publicacion.html?id=" +
                            indice;


                        const imagen =
                            document.createElement("div");

                        imagen.className =
                            "producto-imagen";


                        if (
                            Array.isArray(
                                publicacion.images
                            ) &&
                            publicacion.images.length > 0
                        ) {

                            const img =
                                document.createElement("img");

                            img.src =
                                publicacion.images[0];

                            img.alt =
                                publicacion.title || "";


                            imagen.appendChild(img);

                        } else {

                            const textoImagen =
                                document.createElement("span");

                            textoImagen.textContent =
                                "IMAGEN " + numero;


                            imagen.appendChild(
                                textoImagen
                            );
                        }


                        const titulo =
                            document.createElement("h2");

                        titulo.textContent =
                            publicacion.title || "";


                        const precio =
                            document.createElement("p");

                        precio.textContent =
                            publicacion.price || "";


                        enlace.appendChild(imagen);
                        enlace.appendChild(titulo);
                        enlace.appendChild(precio);

                        producto.appendChild(enlace);

                        catalogo.appendChild(producto);

                    }
                );

            } catch (error) {

                console.error(error);

                catalogo.innerHTML =
                    "<p>No se ha podido cargar el catálogo.</p>";
            }
        }


        cargarCatalogo();

    </script>

</body>
</html>
