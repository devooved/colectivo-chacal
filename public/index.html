<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>COLECTIVO CHACAL</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="site-header">

        <button
            type="button"
            class="mobile-menu-button"
            id="mobile-menu-button"
            aria-expanded="false"
            aria-controls="mobile-menu"
            aria-label="Abrir menú"
        >
            <span></span>
            <span></span>
            <span></span>
        </button>


        <a href="index.html" class="site-title">
            COLECTIVO CHACAL
        </a>


        <nav class="site-nav">

            <div class="nav-publicaciones">

                <button
                    type="button"
                    class="nav-dropdown-button"
                    id="publicaciones-button"
                    aria-expanded="false"
                    aria-controls="publicaciones-menu"
                >
                    PUBLICACIONES
                </button>

                <div
                    class="nav-dropdown"
                    id="publicaciones-menu"
                >
                    <a href="#" data-categoria="TODO">TODO</a>
                    <a href="#" data-categoria="FANZINES">FANZINES</a>
                    <a href="#" data-categoria="REVISTAS">REVISTAS</a>
                    <a href="#" data-categoria="LIBROS">LIBROS</a>
                    <a href="#" data-categoria="MÁS">MÁS</a>
                </div>

            </div>

            <a href="pedidos.html">PEDIDOS</a>

            <a href="about.html">ABOUT</a>

        </nav>


        <a
            href="https://www.instagram.com/colectivochacal"
            class="mobile-instagram"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram de COLECTIVO CHACAL"
        >
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <rect
                    x="3"
                    y="3"
                    width="18"
                    height="18"
                    rx="5"
                    ry="5"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                ></rect>

                <circle
                    cx="12"
                    cy="12"
                    r="4"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                ></circle>

                <circle
                    cx="17.5"
                    cy="6.5"
                    r="1.2"
                    fill="currentColor"
                ></circle>
            </svg>
        </a>


        <nav
            class="mobile-menu"
            id="mobile-menu"
            aria-hidden="true"
        >

            <div class="mobile-publicaciones">

                <button
                    type="button"
                    class="mobile-publicaciones-button"
                    id="mobile-publicaciones-button"
                    aria-expanded="false"
                    aria-controls="mobile-categorias"
                >
                    PUBLICACIONES
                </button>

                <div
                    class="mobile-categorias"
                    id="mobile-categorias"
                >
                    <a href="#" data-categoria="TODO">TODO</a>
                    <a href="#" data-categoria="FANZINES">FANZINES</a>
                    <a href="#" data-categoria="REVISTAS">REVISTAS</a>
                    <a href="#" data-categoria="LIBROS">LIBROS</a>
                    <a href="#" data-categoria="MÁS">MÁS</a>
                </div>

            </div>

            <a href="pedidos.html">PEDIDOS</a>
            <a href="about.html">ABOUT</a>

        </nav>

    </header>


    <main class="publicaciones">

        <section class="grid" id="catalogo"></section>

    </main>


    <script>

        const publicacionesButton =
            document.getElementById("publicaciones-button");

        const publicacionesMenu =
            document.getElementById("publicaciones-menu");

        const mobileMenuButton =
            document.getElementById("mobile-menu-button");

        const mobileMenu =
            document.getElementById("mobile-menu");

        const mobilePublicacionesButton =
            document.getElementById("mobile-publicaciones-button");

        const mobileCategorias =
            document.getElementById("mobile-categorias");

        const catalogo =
            document.getElementById("catalogo");

        let publicaciones = [];


        publicacionesButton.addEventListener(
            "click",
            function () {

                const abierto =
                    publicacionesButton.getAttribute("aria-expanded") === "true";

                publicacionesButton.setAttribute(
                    "aria-expanded",
                    String(!abierto)
                );

                publicacionesMenu.classList.toggle(
                    "abierto",
                    !abierto
                );
            }
        );


        mobileMenuButton.addEventListener(
            "click",
            function () {

                const abierto =
                    mobileMenuButton.getAttribute("aria-expanded") === "true";

                mobileMenuButton.setAttribute(
                    "aria-expanded",
                    String(!abierto)
                );

                mobileMenu.setAttribute(
                    "aria-hidden",
                    String(abierto)
                );

                mobileMenu.classList.toggle(
                    "abierto",
                    !abierto
                );
            }
        );


        mobilePublicacionesButton.addEventListener(
            "click",
            function () {

                const abierto =
                    mobilePublicacionesButton.getAttribute(
                        "aria-expanded"
                    ) === "true";

                mobilePublicacionesButton.setAttribute(
                    "aria-expanded",
                    String(!abierto)
                );

                mobileCategorias.classList.toggle(
                    "abierto",
                    !abierto
                );
            }
        );


        document.addEventListener(
            "click",
            function (evento) {

                if (
                    !evento.target.closest(".nav-publicaciones")
                ) {

                    publicacionesButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    publicacionesMenu.classList.remove(
                        "abierto"
                    );
                }


                if (
                    !evento.target.closest(".site-header")
                ) {

                    mobileMenuButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    mobileMenu.setAttribute(
                        "aria-hidden",
                        "true"
                    );

                    mobileMenu.classList.remove(
                        "abierto"
                    );

                    mobilePublicacionesButton.setAttribute(
                        "aria-expanded",
                        "false"
                    );

                    mobileCategorias.classList.remove(
                        "abierto"
                    );
                }
            }
        );


        function cerrarMenuMovil() {

            mobileMenuButton.setAttribute(
                "aria-expanded",
                "false"
            );

            mobileMenu.setAttribute(
                "aria-hidden",
                "true"
            );

            mobileMenu.classList.remove(
                "abierto"
            );

            mobilePublicacionesButton.setAttribute(
                "aria-expanded",
                "false"
            );

            mobileCategorias.classList.remove(
                "abierto"
            );
        }


        function mostrarPublicaciones(
            publicacionesFiltradas
        ) {

            catalogo.innerHTML = "";

            publicacionesFiltradas.forEach(
                function (publicacion) {

                    const indice =
                        publicaciones.indexOf(publicacion);

                    const numero =
                        String(indice + 1).padStart(2, "0");

                    const producto =
                        document.createElement("article");

                    producto.className = "producto";

                    const enlace =
                        document.createElement("a");

                    enlace.href =
                        "publicacion.html?id=" + indice;

                    const imagen =
                        document.createElement("div");

                    imagen.className =
                        "producto-imagen";


                    if (
                        Array.isArray(publicacion.images) &&
                        publicacion.images.length > 0
                    ) {

                        const img =
                            document.createElement("img");

                        img.src =
                            publicacion.images[0];

                        img.alt =
                            publicacion.title || "";

                        imagen.appendChild(img);

                    } else {

                        const textoImagen =
                            document.createElement("span");

                        textoImagen.textContent =
                            "IMAGEN " + numero;

                        imagen.appendChild(textoImagen);
                    }


                    const titulo =
                        document.createElement("h2");

                    titulo.textContent =
                        publicacion.title || "";


                    const precio =
                        document.createElement("p");

                    precio.textContent =
                        publicacion.price || "";


                    enlace.appendChild(imagen);
                    enlace.appendChild(titulo);
                    enlace.appendChild(precio);

                    producto.appendChild(enlace);
                    catalogo.appendChild(producto);
                }
            );


            if (
                publicacionesFiltradas.length === 0
            ) {

                catalogo.innerHTML =
                    "<p>No hay publicaciones en esta categoría.</p>";
            }
        }


        function filtrarPorCategoria(categoria) {

            if (categoria === "TODO") {

                mostrarPublicaciones(publicaciones);
                return;
            }


            const filtradas =
                publicaciones.filter(
                    function (publicacion) {

                        if (
                            !Array.isArray(
                                publicacion.categories
                            )
                        ) {
                            return false;
                        }

                        return publicacion.categories.includes(
                            categoria
                        );
                    }
                );


            mostrarPublicaciones(filtradas);
        }


        document
            .querySelectorAll("[data-categoria]")
            .forEach(
                function (enlace) {

                    enlace.addEventListener(
                        "click",
                        function (evento) {

                            evento.preventDefault();

                            const categoria =
                                enlace.dataset.categoria;

                            filtrarPorCategoria(
                                categoria
                            );

                            publicacionesButton.setAttribute(
                                "aria-expanded",
                                "false"
                            );

                            publicacionesMenu.classList.remove(
                                "abierto"
                            );

                            cerrarMenuMovil();
                        }
                    );
                }
            );


        async function cargarCatalogo() {

            try {

                const respuesta =
                    await fetch("catalogo.json");

                if (!respuesta.ok) {
                    throw new Error(
                        "No se pudo cargar catalogo.json"
                    );
                }


                const datos =
                    await respuesta.json();


                if (
                    !datos ||
                    !Array.isArray(datos.publicaciones)
                ) {
                    throw new Error(
                        "El formato de catalogo.json no es válido"
                    );
                }


                publicaciones =
                    datos.publicaciones;

                mostrarPublicaciones(
                    publicaciones
                );

            } catch (error) {

                console.error(error);

                catalogo.innerHTML =
                    "<p>No se ha podido cargar el catálogo.</p>";
            }
        }


        cargarCatalogo();

    </script>

</body>
</html>
